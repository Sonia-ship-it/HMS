# Application Configuration
spring.application.name=hospital-management

# PostgreSQL Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/hospitaldb
spring.datasource.username=postgres
spring.datasource.password=Soniauwase@123
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Actuator configuration (per notes)
# Exposing all endpoints for demonstration
management.endpoints.web.exposure.include=health,info,metrics,beans
management.info.env.enabled=true

# DevTools configuration (per notes)
spring.devtools.restart.enabled=true
