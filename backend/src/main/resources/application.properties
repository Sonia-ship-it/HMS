spring.application.name=${APP_NAME:smart-hospital-hms}
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hospitaldb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Soniauwase@123}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:SmartHospitalHMS_SecureKey_ChangeInProduction_Min32Chars}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,beans,env
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
info.app.name=${APP_NAME:Smart Hospital HMS}
info.app.description=Appointment and Queue Management
info.app.version=${APP_VERSION:2.0}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# CORS (Next.js dev server)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring.devtools.restart.enabled=true
